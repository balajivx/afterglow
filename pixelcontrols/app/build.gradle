plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixelcontrols'
    compileSdk 34

    defaultConfig {
        applicationId "com.pixelcontrols"
        minSdk 29
        // Android 9 on purpose (as AA Switch): an app targeting it may still switch Wi-Fi on and off, which is how
        // the Android Auto wired/wireless switch works with no helper. Checked on the Pixel 9a, Android 17, whose
        // oldest accepted target is 28.
        targetSdk 28
        versionCode 9
        versionName "2.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'txt'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

