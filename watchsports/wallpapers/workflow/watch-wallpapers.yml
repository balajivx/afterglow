# Copied to .github/workflows/ in the afterglow repo by watchsports/sync_to_afterglow.sh.
# Once a month: 24 new photos for the watch face (watchsports/wallpapers/make_month.py), committed here, then
# downloaded by the watch (watchsports app, Wallpapers.java) from raw.githubusercontent.com.
name: Watch wallpapers
on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st
  workflow_dispatch:
permissions:
  contents: write
jobs:
  month:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - run: python watchsports/wallpapers/make_month.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchsports/wallpapers
          git diff --cached --quiet || git commit -m "watch wallpapers: $(date -u +%Y-%m)"
          git push
